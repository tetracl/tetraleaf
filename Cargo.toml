[workspace]
# Keep "2"; moving to "3" (MSRV-aware resolution) is a separate decision.
resolver = "2"
members = ["tetraleaf-plan", "tetraleaf-octree", "tetraleaf-math", "tetraleaf-ref", "tetraleaf-validate", "tetraleaf-tables", "tetraleaf-exec", "tetraleaf-simd", "tetraleaf-kernels", "tetraleaf-bench"]
# The spikes are a workspace of their own (spikes/Cargo.toml, with its own lock file; Helmholtz
# CHA.1), built by hand from spikes/ and never by this workspace's checks.
exclude = ["spikes"]
# Without default-members every member is built; tetraleaf-kernels is a member only, so the
# default checks build it without a backend.
default-members = ["tetraleaf-octree", "tetraleaf-plan", "tetraleaf-math", "tetraleaf-ref", "tetraleaf-validate", "tetraleaf-tables", "tetraleaf-exec", "tetraleaf-simd", "tetraleaf-bench"]

# Every crate but tetraleaf-octree/ inherits from this; tetraleaf-octree/ keeps its own fields.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tetracl/tetraleaf"
repository = "https://github.com/tetracl/tetraleaf"

[workspace.dependencies]
num-traits = "0.2"
# Helmholtz CH1.2b: the complex type of tetraleaf-math (re-exported as tetraleaf_math::Complex),
# signed off by the user on 2026-10-30; already in the lock file through rlst.
num-complex = "0.4"
thiserror = "2"
proptest = "1"
approx = "0.5"
serde_json = "1"
# Pinned exactly; only tetraleaf-kernels and spikes/ may use CubeCL (spikes/Cargo.toml repeats
# these three pins; move them together). 0.11.0 is a release
# (2026-10-06), the first after the pre-release 0.11.0-pre.4 that Phase 4 T2 chose on
# 2026-10-03 because it runs f64 on CUDA, which 0.10.0 disabled; moved in Phase 5S T1s.
# cubek-matmul and cubek-std 0.3.0 are the releases built against it (their manifests
# ask for cubecl "0.11.0", a caret requirement, where the pre-releases pinned
# =0.11.0-pre.4; the exact pin here selects 0.11.0). cubek-matmul needs "multi-level"
# (the strategies of 0.2.0) or "tiled".
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "stdlib"] }
cubek-matmul = { version = "=0.3.0", default-features = false, features = ["std", "multi-level"] }
cubek-std = { version = "=0.3.0", default-features = false }
tetraleaf-math = { path = "tetraleaf-math" }
tetraleaf-ref = { path = "tetraleaf-ref" }
tetraleaf-tables = { path = "tetraleaf-tables" }
# Phase 4: every CubeCL kernel. A member, not a default member (signed off with T4).
tetraleaf-kernels = { path = "tetraleaf-kernels" }
# Phase 3, at the versions tetraleaf-octree/ uses. rlst is never given the "mpi" feature here;
# the crates that need it (tetraleaf-octree, tetraleaf-plan) enable it themselves.
mpi = { version = "0.8.2", features = ["derive"] }
rlst = "0.12.0"
rand_chacha = "0.10"
# Host threading of the Laplace FMM (Phase 3 T10); tetraleaf-exec only.
rayon = "1"
# Helmholtz CH4.6a1: the optional FFT back end of the diagonal form's φ step (D7, signed off at
# CH0.9), behind tetraleaf-exec's feature `rustfft`, enabled by no workspace crate. Pinned exactly
# (the user, 2026-11-26: "Exact =6.4.1 (Recommended)"), the version spike S9 measured, so that the
# version in the build's agreement across ranks is the one built. MIT OR Apache-2.0.
rustfft = "=6.4.1"
# tetraleaf-octree/ does not use these entries yet (a separate decision).
tetraleaf-octree = { path = "tetraleaf-octree" }
tetraleaf-plan = { path = "tetraleaf-plan" }
tetraleaf-exec = { path = "tetraleaf-exec" }
# Phase 3S: hand-written SIMD kernels of the host path (tetraleaf-exec, tetraleaf-validate).
tetraleaf-simd = { path = "tetraleaf-simd" }
# Development tooling; no library crate may depend on it (tetraleaf-validate/CLAUDE.md). The
# Phase 3S T7 spike example `compare` takes its P2P workloads.
tetraleaf-validate = { path = "tetraleaf-validate" }
# Phase 4S T6: the one-command benchmark (tools/bench/run.sh); a binary, no crate
# depends on it.
tetraleaf-bench = { path = "tetraleaf-bench" }
