[package]
name = "tetraleaf-spike-device-arith"
version = "0.0.0"
description = "Throwaway study: device floating-point arithmetic per CubeCL backend, the CONVENTIONS §3.13 r² = 0 argument on the device, P2P candidates, and a CPU-shaped P2P on the CubeCL CPU runtime against tetraleaf-simd (Phase 4, T3)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# No backend by default: `cargo test -p tetraleaf-spike-device-arith` without features
# builds no runtime. The smoke test needs `--features cpu`.
default = []
cpu = ["cubecl/cpu", "tetraleaf-kernels/cpu"]
metal = ["cubecl/metal", "tetraleaf-kernels/metal"]
# No `metal-native` (`cubecl-metal`, MTLMathMode::Safe): cubecl-metal 0.11.0-pre.4 does not
# compile (`DebugInformation` is not imported in src/compute/context.rs:139; REPORT.md).
# Fixed in 0.11.0 (Phase 5S T1s: imported at src/compute/context.rs:6; `cargo check` of
# cubecl 0.11.0 with `metal-native` passes on the M3 Max); the spike is unchanged.
# CubeCL's default LLVM NVPTX path; run on locust's H100 (Phase 4S T3, REPORT.md).
cuda = ["cubecl/cuda", "tetraleaf-kernels/cuda"]
# CUDA through NVRTC instead (CubeCL's `cuda-cpp`), for the Phase 4S T3 comparison only.
# Production code stays on LLVM NVPTX (docs/phase4s/README.md, decision 4).
cuda-cpp = ["cuda", "cubecl/cuda-cpp"]

[dependencies]
cubecl.workspace = true
tetraleaf-math.workspace = true
# The production dipole P2P on the §3.13 pairs (Phase 6 T8d, the `dipoles` section).
tetraleaf-kernels.workspace = true
tetraleaf-ref.workspace = true
tetraleaf-tables.workspace = true
tetraleaf-simd.workspace = true
# The W1 workload, its oracle and measures (`tetraleaf_validate::p2p_kernels`), the timing
# loop and the machine description. tetraleaf-validate links MPI; nothing here initialises it.
tetraleaf-validate.workspace = true
# The 12-thread host baseline of the CPU-runtime comparison.
rayon.workspace = true
