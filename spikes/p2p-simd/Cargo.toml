[package]
name = "tetraleaf-spike-p2p-simd"
version = "0.0.0"
description = "Throwaway benchmark: SIMD P2P loop orders, inverse square roots and the green-kernels baseline (Phase 3S, T2); the production kernel against green-kernels (T7)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tetraleaf-math.workspace = true
tetraleaf-ref.workspace = true
green-kernels.workspace = true
pulp.workspace = true
# T7: the production kernel, and the inputs and measures of tetraleaf-validate's
# `p2p_kernels` example (tetraleaf-validate links MPI; `compare` never initialises it).
tetraleaf-simd.workspace = true
tetraleaf-validate.workspace = true

# `cargo test` runs the smoke test of `compare`'s core.
[[example]]
name = "compare"
test = true

# Helmholtz CH2.4b: the Yukawa P2P's cost per pair against Laplace's, beside
# green-kernels' modified Helmholtz; `cargo test` runs its smoke test.
[[example]]
name = "yukawa"
test = true

# Helmholtz CH3.4b: the Helmholtz P2P's cost per pair against Laplace's and Yukawa's,
# beside green-kernels' Helmholtz; `cargo test` runs its smoke test.
[[example]]
name = "helmholtz"
test = true
