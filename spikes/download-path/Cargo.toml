[package]
name = "tetraleaf-spike-download-path"
version = "0.0.0"
description = "Throwaway study: the device download and upload paths per step (CubeCL's read and write, its host pools, the host copies of tetraleaf-kernels' Device) and the zeroing of an evaluation's load, on the CPU runtime, Metal and CUDA (Phase 4S T11)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# No backend by default: `cargo build -p tetraleaf-spike-download-path` without features
# builds no runtime.
default = []
cpu = ["cubecl/cpu", "tetraleaf-kernels/cpu"]
metal = ["cubecl/metal", "tetraleaf-kernels/metal"]
cuda = ["cubecl/cuda", "tetraleaf-kernels/cuda"]

[dependencies]
cubecl.workspace = true
tetraleaf-kernels.workspace = true
# The parallel copy compared with the serial one (T9's output pass copies on a rayon pool).
rayon.workspace = true
# The machine description of the report. tetraleaf-validate links MPI; nothing here
# initialises it.
tetraleaf-validate.workspace = true
