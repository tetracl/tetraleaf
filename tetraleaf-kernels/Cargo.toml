[package]
name = "tetraleaf-kernels"
version = "0.1.0-dev"
description = "CubeCL device kernels of the tetraleaf FMM: backends, the f64 capability check, device buffers, and the data movement primitives (Phase 4)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tetraleaf_kernels"

# No backend by default: without a feature the crate builds its kernel definitions and
# host-side types, and `Device::open` reports every backend as not compiled.
[features]
default = []
# The CubeCL CPU runtime (LLVM JIT); its build downloads the tracel-llvm bundle.
cpu = ["cubecl/cpu"]
# wgpu with the MSL compiler (CubeCL's `metal` = `wgpu-msl`), not `metal-native`.
metal = ["cubecl/metal"]
# CUDA through LLVM NVPTX: f32 and f64, run by hand on locust (Phase 4S); type-checked in CI.
cuda = ["cubecl/cuda"]

[dependencies]
cubecl = { workspace = true }
cubek-matmul = { workspace = true }
cubek-std = { workspace = true }
tetraleaf-math = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tetraleaf-ref = { workspace = true }
tetraleaf-tables = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "kernels"
path = "tests/kernels/main.rs"
